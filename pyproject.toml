[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkflow"
version = "0.1.0"
description = "An upgraded version of my current SSG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "jinja2>=3.1.6",
    "markdown2>=2.5.4",
    "pygments>=2.19.2",
    "python-dateutil>=2.9.0.post0",
    "typer>=0.24.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[project.scripts]
inkflow = "inkflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
